<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Screen</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-900">
    <div class="min-h-screen w-full flex items-center justify-center">
        <section class="max-w-sm w-full min-h-30 bg-white py-4 px-4 rounded-lg">
            <h1 class="text-2xl font-bold">
                User Login
            </h1>
            <p class="mb-3">
                Enter your email and password to proceed
            </p>

            <form action="">
                <div>
                    <label for="email" class="font-bold mb-1 inline-block">Email Address</label>
                    <input type="email" required name="email" id="email" class="block border border-gray-300 w-full h-10 rounded-lg px-2">
                </div>
                <div class="mt-3">
                    <label for="password" class="font-bold mb-1 inline-block">Password</label>
                    <input type="password" required name="password" id="password" class="block border border-gray-300 w-full h-10 rounded-lg px-2">
                </div>
                <div class="mt-1 flex justify-between items-center">
                    <div>
                        <input type="checkbox" name="remember" id="remember"> Remember me
                    </div>
                    <div>
                        <a href="" class="text-blue-500 hover:underline">Forgot Password</a>
                    </div>
                </div>
                
                <div class="mt-5 flex justify-end">
                    <button class="bg-blue-900 text-white rounded-lg py-1 px-4">
                        Login
                    </button>
                </div>
                <div class="mt-5 text-center">
                    <a href="register.html">Dont Have an account? <span class="text-blue-500">Sign Up</span></a>
                </div>
            </form>

        </section>
    </div>
</body>
</html>
